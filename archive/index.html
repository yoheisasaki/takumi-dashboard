<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>月刊TAKUMI 過去号一覧</title>
<style>
  :root{ --ink:#141210; --sub:#55504a; --mute:#8b857d; --mute2:#a5a09a; --red:#d43c2f; --red-h:#a8281d; }
  *{box-sizing:border-box;}
  body{margin:0;background:#eceae4;font-family:'Zen Kaku Gothic New',sans-serif;color:var(--ink);}
  a{color:var(--red);text-decoration:none}
  a:hover{color:var(--red-h)}
  .wrap{max-width:480px;margin:0 auto;padding:32px 20px 48px;}
  h1{font-size:14px;letter-spacing:.3em;border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);
      padding:12px 0;margin:0 0 20px;}
  ul{list-style:none;margin:0;padding:0;}
  li{border-bottom:1px solid var(--ink);}
  li a{display:block;padding:16px 4px;font-size:14px;font-weight:700;color:var(--ink);}
  li a:hover{color:var(--red);}
  .empty{font-size:13px;color:var(--mute);padding:16px 4px;}
  .back{display:inline-block;margin-top:28px;font-size:12px;color:var(--mute);}
</style>
</head>
<body>
<div class="wrap">
  <h1>月刊TAKUMI 過去号一覧</h1>
  <ul>
    <li><a href="2026-08/">2026年8月号</a></li>
    <li><a href="2026-07/">2026年7月号</a></li>

</div>

</html>
